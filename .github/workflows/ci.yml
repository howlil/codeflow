name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print formatted M2.2 files
        run: |
          pnpm exec prettier --write apps/web/src/App.tsx apps/web/src/App.test.tsx
          echo '=== APP_TSX ==='
          cat apps/web/src/App.tsx
          echo '=== APP_TEST_TSX ==='
          cat apps/web/src/App.test.tsx
          exit 1

      - name: Verify repository
        run: pnpm check
