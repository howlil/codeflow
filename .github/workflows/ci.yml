name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          base_ref="$(git rev-parse HEAD^ 2>/dev/null || true)"
          if [ -z "$base_ref" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            echo "agent_only=false" >> "$GITHUB_OUTPUT"
            echo "deployment=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runtime=false
          agent_only=true
          deployment=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              AGENTS.md|.agents/*)
                ;;
              *)
                runtime=true
                agent_only=false
                ;;
            esac

            case "$file" in
              Dockerfile|compose.yaml|deploy/*|.dockerignore|.env.example|.github/workflows/ci.yml)
                deployment=true
                ;;
            esac
          done < <(git diff --name-only "$base_ref" HEAD)

          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "agent_only=$agent_only" >> "$GITHUB_OUTPUT"
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"

      - name: Verify agent knowledge
        if: steps.scope.outputs.agent_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^
          test -f AGENTS.md
          test -f .agents/PROJECT.md
          test -f .agents/ARCHITECTURE.md
          test -f .agents/CURRENT_ITERATION.md
          test -f .agents/CODE_PATTERNS.md
          test -f .agents/QUALITY.md
          test -f .agents/DECISIONS.md
          test -f .agents/DESIGN.md
          test ! -d .agents/skills

      - name: Enable Corepack
        if: steps.scope.outputs.runtime == 'true'
        run: corepack enable

      - name: Set up Node.js
        if: steps.scope.outputs.runtime == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.scope.outputs.runtime == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: steps.scope.outputs.runtime == 'true'
        run: pnpm format:check

      - name: Lint
        if: steps.scope.outputs.runtime == 'true'
        run: pnpm lint

      - name: Build
        if: steps.scope.outputs.runtime == 'true'
        run: pnpm build

      - name: Test
        if: steps.scope.outputs.runtime == 'true'
        run: pnpm test

      - name: Validate production Compose
        if: steps.scope.outputs.deployment == 'true'
        run: docker compose config

      - name: Smoke test production Compose
        if: steps.scope.outputs.deployment == 'true'
        run: |
          trap 'docker compose down --remove-orphans' EXIT

          docker compose up -d --build

          for attempt in {1..30}; do
            if docker compose exec -T web wget -qO- http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker compose ps
          docker compose logs
          exit 1
