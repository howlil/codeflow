name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm check

      - name: Detect deployment changes
        id: deployment
        shell: bash
        run: |
          base_ref="$(git rev-parse HEAD^ 2>/dev/null || true)"
          if [ -z "$base_ref" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$base_ref" HEAD | grep -Eq '^(Dockerfile|compose\.yaml|deploy/|\.dockerignore$|\.env\.example$|\.github/workflows/ci\.yml$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate production Compose
        if: steps.deployment.outputs.required == 'true'
        run: docker compose config

      - name: Smoke test production Compose
        if: steps.deployment.outputs.required == 'true'
        run: |
          trap 'docker compose down --remove-orphans' EXIT

          docker compose up -d --build

          for attempt in {1..30}; do
            if docker compose exec -T web wget -qO- http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker compose ps
          docker compose logs
          exit 1
