name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.head_ref || github.ref }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Stabilize repository formatting
        run: |
          pnpm format
          pnpm format

      - name: Commit generated dependency state
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/web .agents/DESIGN.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync Chatspace design dependencies"
          git push origin HEAD:${{ github.head_ref }}

      - name: Verify repository
        run: pnpm check

      - name: Detect deployment changes
        id: deployment
        shell: bash
        run: |
          base_ref="$(git rev-parse HEAD^ 2>/dev/null || true)"
          if [ -z "$base_ref" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$base_ref" HEAD | grep -Eq '^(Dockerfile|compose\.yaml|deploy/|\.dockerignore$|\.env\.example$|\.github/workflows/ci\.yml$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate production Compose
        if: steps.deployment.outputs.required == 'true'
        run: docker compose config

      - name: Smoke test production Compose
        if: steps.deployment.outputs.required == 'true'
        run: |
          trap 'docker compose down --remove-orphans' EXIT

          docker compose up -d --build

          for attempt in {1..30}; do
            if docker compose exec -T web wget -qO- http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker compose ps
          docker compose logs
          exit 1
