name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm check

      - name: Validate production Compose
        run: docker compose config

      - name: Smoke test production Compose
        run: |
          trap 'docker compose down --remove-orphans' EXIT

          docker compose up -d --build

          for attempt in {1..30}; do
            if docker compose exec -T web wget -qO- http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker compose ps
          docker compose logs
          exit 1
