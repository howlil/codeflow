name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format M4 sources
        run: pnpm prettier --write apps/api/src/m4.test.ts apps/web/src/StaticFlowPanel.test.tsx apps/web/src/StaticFlowPanel.tsx packages/analysis-core/src/typescript-flow.ts

      - name: Upload formatted M4 sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-m4
          path: |
            apps/api/src/m4.test.ts
            apps/web/src/StaticFlowPanel.test.tsx
            apps/web/src/StaticFlowPanel.tsx
            packages/analysis-core/src/typescript-flow.ts

      - name: Verify formatted repository
        run: pnpm lint && pnpm build && pnpm test
