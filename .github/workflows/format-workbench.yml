name: Format Workbench

on:
  push:
    branches:
      - feat/workbench-design-refactor
    paths:
      - .github/workflows/format-workbench.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workbench-design-refactor
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/workbench.css
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/workbench.css
          git diff --cached --quiet || git commit -m "style: format workbench stylesheet"
          git push origin HEAD:feat/workbench-design-refactor
