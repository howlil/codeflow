name: Apply M12 lint fix

on:
  push:
    branches:
      - refactor/m12-graph-first-codeflow

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Remove derived-state effects
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          graph_path = Path('apps/web/src/GraphWorkspace.tsx')
          text = graph_path.read_text()
          reset = """  useEffect(() => {\n    setLevel('code');\n    setLens('ALL');\n    setFocusId(flow.entryPointId);\n    setSelectedNodeId(flow.entryPointId);\n    setSelectedEdgeId(null);\n    setExpandedIncoming(new Set());\n    setExpandedOutgoing(new Set([flow.entryPointId]));\n    setQuery('');\n    setImpact(null);\n    setImpactError(null);\n  }, [flow.id, flow.entryPointId]);\n\n"""
          if reset not in text:
              raise SystemExit('missing flow reset effect')
          text = text.replace(reset, '', 1)
          text = text.replace(
              "const [lens, setLens] = useState<GraphLens>('ALL');",
              "const [requestedLens, setRequestedLens] = useState<GraphLens>('ALL');",
              1,
          )
          lens_effect = """  useEffect(() => {\n    if (!availableLenses.includes(lens)) {\n      setLens('ALL');\n    }\n  }, [availableLenses, lens]);\n\n"""
          if lens_effect not in text:
              raise SystemExit('missing lens effect')
          text = text.replace(
              lens_effect,
              "  const lens: GraphLens = availableLenses.includes(requestedLens)\n    ? requestedLens\n    : 'ALL';\n\n",
              1,
          )
          text = text.replace('setLens(', 'setRequestedLens(')
          text = text.replace('onLensChange={setLens}', 'onLensChange={setRequestedLens}')
          graph_path.write_text(text)

          app_path = Path('apps/web/src/App.tsx')
          app = app_path.read_text()
          marker = """        <GraphWorkspace\n          flow={flow}\n"""
          replacement = """        <GraphWorkspace\n          key={`${flow.id}:${flow.entryPointId}:${changeAnalysis?.change.source.headRevision ?? ''}`}\n          flow={flow}\n"""
          if marker not in app:
              raise SystemExit('missing GraphWorkspace marker')
          app_path.write_text(app.replace(marker, replacement, 1))
          PY
          pnpm exec prettier --write apps/web/src/GraphWorkspace.tsx apps/web/src/App.tsx
          rm .github/workflows/m12-lint-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: derive graph state without effects"
          git push
