name: M8 Format

on:
  push:
    branches:
      - feat/m8-change-impact-explorer

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-change-impact-explorer
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/impact.ts apps/api/src/m8.test.ts apps/web/src/flow-client.ts apps/web/src/ImpactPanel.tsx apps/web/src/ImpactPanel.test.tsx apps/web/src/impact.css packages/analysis-core/src/impact-analysis.ts packages/analysis-core/src/impact-analysis.test.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/impact.ts apps/api/src/m8.test.ts apps/web/src/flow-client.ts apps/web/src/ImpactPanel.tsx apps/web/src/ImpactPanel.test.tsx apps/web/src/impact.css packages/analysis-core/src/impact-analysis.ts packages/analysis-core/src/impact-analysis.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(m8): format impact explorer"
          git push origin HEAD:feat/m8-change-impact-explorer
