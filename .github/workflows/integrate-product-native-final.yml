name: Integrate product-native UX cleanup on latest master

'on':
  push:
    branches:
      - refactor/product-native-ux-cleanup-final
    paths:
      - .github/workflows/integrate-product-native-final.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest-master branch
        uses: actions/checkout@v4
        with:
          ref: refactor/product-native-ux-cleanup-final
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply already-verified milestone files
        shell: bash
        run: |
          git fetch origin refactor/product-native-ux-cleanup-current
          for path in \
            .agents/CURRENT_ITERATION.md \
            .agents/DESIGN.md \
            apps/web/src/App.test.tsx \
            apps/web/src/App.tsx \
            apps/web/src/components/ui/primitives.tsx \
            apps/web/src/features/acquisition/GitHubRepositoryPicker.test.tsx \
            apps/web/src/features/acquisition/GitHubRepositoryPicker.tsx \
            apps/web/src/features/acquisition/LandingExperience.tsx \
            apps/web/src/features/workspace/GraphWorkspace.tsx \
            apps/web/src/main.tsx \
            apps/web/src/styles/graph-workspace.css \
            apps/web/src/styles/index.css \
            apps/web/src/styles/landing.css
          do
            git show FETCH_HEAD:$path > $path
          done
          rm -f apps/web/src/styles/workbench.css apps/web/src/styles/anthropic-theme.css

      - name: Format
        run: pnpm format

      - name: Verify
        run: pnpm check

      - name: Commit final integration
        shell: bash
        run: |
          rm .github/workflows/integrate-product-native-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: make CodeFlow UX product-native'
          git push origin HEAD:refactor/product-native-ux-cleanup-final
