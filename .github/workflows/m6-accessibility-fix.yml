name: M6 Accessibility Fix

on:
  push:
    branches:
      - feat/m6-repository-architecture-symbol-navigation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m6-repository-architecture-symbol-navigation
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Add explicit accessible entity label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/ArchitecturePanel.tsx')
          text = path.read_text()
          old = '''        <button\n          className="architecture-entity-button"\n          type="button"\n          aria-pressed={selectedId === entity.id}\n'''
          new = '''        <button\n          className="architecture-entity-button"\n          type="button"\n          aria-label={`${entity.name} ${entity.kind}`}\n          aria-pressed={selectedId === entity.id}\n'''
          if old not in text:
              raise SystemExit('target hierarchy button not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/web/src/ArchitecturePanel.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/ArchitecturePanel.tsx
          git commit -m "fix(m6): label architecture entities accessibly"
          git push origin HEAD:feat/m6-repository-architecture-symbol-navigation
