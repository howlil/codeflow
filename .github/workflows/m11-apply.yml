name: Apply M11

on:
  push:
    branches:
      - feat/m11-clear-entry-truthful-flow

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply M11 slices
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          app = 'apps/web/src/App.tsx'
          replace_once(
              app,
              "type WorkbenchView = 'explore' | 'flow' | 'impact';\ntype Theme = 'dark' | 'light';",
              "type WorkbenchView = 'explore' | 'flow' | 'impact';\ntype AcquisitionIntent = 'repository' | 'change' | null;\ntype Theme = 'dark' | 'light';",
          )
          replace_once(
              app,
              "  const [workbenchView, setWorkbenchView] = useState<WorkbenchView>('explore');\n  const [theme, setTheme] = useState<Theme>(getInitialTheme);",
              "  const [workbenchView, setWorkbenchView] = useState<WorkbenchView>('explore');\n  const [acquisitionIntent, setAcquisitionIntent] =\n    useState<AcquisitionIntent>(null);\n  const [theme, setTheme] = useState<Theme>(getInitialTheme);",
          )
          replace_once(
              app,
              "    setWorkbenchView('explore');\n    setQuery('');",
              "    setWorkbenchView('explore');\n    setAcquisitionIntent(null);\n    setQuery('');",
          )
          replace_once(
              app,
              '''      {flow === null && changeAnalysis === null && !analyzing ? (\n        <>\n          <GitHubRepositoryPicker\n            busy={analyzing}\n            error={null}\n            onAnalyze={analyzeGitHub}\n          />\n          <GitHubPullRequestPicker\n            busy={analyzing}\n            onAnalyze={analyzePullRequest}\n          />\n          <details className="local-analysis-option">\n            <summary>Analyze a local repository instead</summary>\n            <RepositoryPicker busy={analyzing} onAnalyze={analyzeRepository} />\n          </details>\n        </>\n      ) : null}''',
              '''      {flow === null && changeAnalysis === null && !analyzing ? (\n        <AcquisitionWorkspace\n          intent={acquisitionIntent}\n          busy={analyzing}\n          onSelectIntent={setAcquisitionIntent}\n          onAnalyzeGitHub={analyzeGitHub}\n          onAnalyzePullRequest={analyzePullRequest}\n          onAnalyzeLocal={analyzeRepository}\n        />\n      ) : null}''',
          )
          replace_once(
              app,
              '<strong>Repository analysis unavailable</strong>',
              '''<strong>\n            {acquisitionIntent === 'change'\n              ? 'Pull request analysis unavailable'\n              : 'Repository analysis unavailable'}\n          </strong>''',
          )
          replace_once(
              app,
              '''                  <section\n                    className="canvas-panel"\n                    aria-label="Semantic flow canvas"\n                  >''',
              '''                  <section\n                    className="canvas-panel"\n                    aria-label="Static call neighborhood"\n                  >''',
          )
          replace_once(
              app,
              '''                    <div className="canvas-toolbar">\n                      <div>\n                        <p className="panel-kicker">Call flow</p>\n                        <h2>\n                          {entryPoint?.label ?? 'Selected entry'} request flow\n                        </h2>\n                      </div>\n                      <span>{flow.nodes.length} functions</span>\n                    </div>''',
              '''                    <div className="canvas-toolbar">\n                      <div>\n                        <p className="panel-kicker">Static call neighborhood</p>\n                        <h2>\n                          {entryPoint?.label ?? 'Selected entry'} call neighborhood\n                        </h2>\n                        <p className="flow-truth-note">\n                          Projected relationships only. Solid lines have verified\n                          static evidence; dashed lines are inferred static\n                          relationships. This is not runtime execution.\n                        </p>\n                      </div>\n                      <span>{flow.nodes.length} functions</span>\n                    </div>''',
          )
          replace_once(
              app,
              "{focusMode ? 'Back to entry flow' : 'Focus selected'}",
              "{focusMode ? 'Back to entry neighborhood' : 'Focus selected'}",
          )
          replace_once(
              app,
              '<span>{evidenceKind}</span>',
              '<span>{evidenceTrustLabel(evidenceKind)}</span>',
          )
          replace_once(
              app,
              '''function ExploreWorkspace({\n  flow,''',
              '''function AcquisitionWorkspace({\n  intent,\n  busy,\n  onSelectIntent,\n  onAnalyzeGitHub,\n  onAnalyzePullRequest,\n  onAnalyzeLocal,\n}: {\n  intent: AcquisitionIntent;\n  busy: boolean;\n  onSelectIntent: (intent: AcquisitionIntent) => void;\n  onAnalyzeGitHub: (repositoryUrl: string) => Promise<void>;\n  onAnalyzePullRequest: (pullRequestUrl: string) => Promise<void>;\n  onAnalyzeLocal: (\n    request: RepositoryAnalysisRequest,\n    summary: RepositorySelectionSummary,\n  ) => Promise<void>;\n}) {\n  if (intent === null) {\n    return (\n      <section\n        className="acquisition-intent"\n        aria-labelledby="acquisition-intent-title"\n      >\n        <div className="acquisition-intent-copy">\n          <p className="panel-kicker">Start</p>\n          <h2 id="acquisition-intent-title">What do you need to understand?</h2>\n          <p>Choose the task first. CodeFlow will show only the input needed for it.</p>\n        </div>\n        <div className="acquisition-intent-actions">\n          <button\n            type="button"\n            className="acquisition-intent-action"\n            onClick={() => onSelectIntent('repository')}\n          >\n            <strong>Understand repository</strong>\n            <span>Orient in structure, then trace functions and impact.</span>\n          </button>\n          <button\n            type="button"\n            className="acquisition-intent-action"\n            onClick={() => onSelectIntent('change')}\n          >\n            <strong>Review change</strong>\n            <span>Inspect an actual pull request across frozen BASE and HEAD revisions.</span>\n          </button>\n        </div>\n      </section>\n    );\n  }\n\n  return (\n    <div className="acquisition-task">\n      <div className="acquisition-task-bar">\n        <Button variant="ghost" onClick={() => onSelectIntent(null)}>\n          Choose another task\n        </Button>\n        <span>\n          {intent === 'repository' ? 'Repository comprehension' : 'Change review'}\n        </span>\n      </div>\n\n      {intent === 'repository' ? (\n        <>\n          <GitHubRepositoryPicker\n            busy={busy}\n            error={null}\n            onAnalyze={onAnalyzeGitHub}\n          />\n          <details className="local-analysis-option">\n            <summary>Analyze a local repository instead</summary>\n            <RepositoryPicker busy={busy} onAnalyze={onAnalyzeLocal} />\n          </details>\n        </>\n      ) : (\n        <GitHubPullRequestPicker busy={busy} onAnalyze={onAnalyzePullRequest} />\n      )}\n    </div>\n  );\n}\n\nfunction ExploreWorkspace({\n  flow,''',
          )
          replace_once(
              app,
              "      return 'Follow callers and callees, then inspect source-backed data and evidence.';",
              "      return 'Inspect a bounded static call neighborhood; inferred relationships stay explicitly marked.';",
          )
          replace_once(
              app,
              '''          <i className="legend-line" /> verified-static''',
              '''          <i className="legend-line" /> Verified static''',
          )
          replace_once(
              app,
              '''          <i className="legend-line legend-line--inferred" /> inferred-static''',
              '''          <i className="legend-line legend-line--inferred" /> Inferred static''',
          )
          replace_once(
              app,
              '''          <i className="legend-line legend-line--unavailable" /> unavailable''',
              '''          <i className="legend-line legend-line--unavailable" /> No evidence''',
          )
          replace_once(
              app,
              '''function getInitialTheme(): Theme {''',
              '''function evidenceTrustLabel(kind: string): string {\n  switch (kind) {\n    case 'verified-static':\n      return 'Verified static';\n    case 'inferred-static':\n      return 'Inferred static';\n    default:\n      return 'No evidence';\n  }\n}\n\nfunction getInitialTheme(): Theme {''',
          )

          test = 'apps/web/src/App.test.tsx'
          replace_once(
              test,
              '''  render(<App />);\n\n  fireEvent.change(screen.getByLabelText('Repository directory'), {''',
              '''  render(<App />);\n\n  fireEvent.click(\n    screen.getByRole('button', { name: 'Understand repository' }),\n  );\n  fireEvent.change(screen.getByLabelText('Repository directory'), {''',
          )
          replace_once(
              test,
              "      : 'handleGreeting request flow',",
              "      : 'handleGreeting call neighborhood',",
          )
          replace_once(
              test,
              '''  it('starts from repository comprehension without analyzing a fixture', () => {\n    const fetchMock = stubFlowRequest();\n\n    render(<App />);\n\n    expect(\n      screen.getByRole('heading', {\n        name: 'Understand an unfamiliar codebase',\n      }),\n    ).toBeInTheDocument();\n    expect(screen.getByText(/Analyze a local repository/)).toBeInTheDocument();\n    expect(fetchMock).not.toHaveBeenCalled();\n  });''',
              '''  it('asks for intent before exposing repository or pull-request input', () => {\n    const fetchMock = stubFlowRequest();\n\n    render(<App />);\n\n    expect(\n      screen.getByRole('heading', { name: 'What do you need to understand?' }),\n    ).toBeInTheDocument();\n    expect(\n      screen.getByRole('button', { name: /Understand repository/ }),\n    ).toBeInTheDocument();\n    expect(\n      screen.getByRole('button', { name: /Review change/ }),\n    ).toBeInTheDocument();\n    expect(\n      screen.queryByLabelText('Public GitHub repository URL'),\n    ).not.toBeInTheDocument();\n    expect(\n      screen.queryByLabelText('Public GitHub pull request URL'),\n    ).not.toBeInTheDocument();\n\n    fireEvent.click(\n      screen.getByRole('button', { name: /Understand repository/ }),\n    );\n    expect(\n      screen.getByRole('heading', { name: 'Understand an unfamiliar codebase' }),\n    ).toBeInTheDocument();\n    expect(screen.getByText(/Analyze a local repository/)).toBeInTheDocument();\n    expect(\n      screen.queryByLabelText('Public GitHub pull request URL'),\n    ).not.toBeInTheDocument();\n\n    fireEvent.click(screen.getByRole('button', { name: 'Choose another task' }));\n    fireEvent.click(screen.getByRole('button', { name: /Review change/ }));\n    expect(\n      screen.getByRole('heading', { name: 'Trace an actual pull request' }),\n    ).toBeInTheDocument();\n    expect(\n      screen.queryByLabelText('Public GitHub repository URL'),\n    ).not.toBeInTheDocument();\n    expect(fetchMock).not.toHaveBeenCalled();\n  });\n\n  it('labels function exploration as a bounded static call neighborhood', async () => {\n    await openRepository();\n\n    expect(\n      screen.getByRole('heading', { name: 'handleGreeting call neighborhood' }),\n    ).toBeInTheDocument();\n    expect(\n      screen.getByText(/Projected relationships only.*not runtime execution/i),\n    ).toBeInTheDocument();\n    expect(screen.getAllByText('Inferred static').length).toBeGreaterThan(0);\n    expect(screen.getAllByText('Verified static').length).toBeGreaterThan(0);\n  });''',
          )

          path = Path(test)
          text = path.read_text()
          text = text.replace("'Back to entry flow'", "'Back to entry neighborhood'")
          text = text.replace("'Semantic flow canvas'", "'Static call neighborhood'")
          path.write_text(text)

          css = Path('apps/web/src/product-workbench.css')
          css_text = css.read_text()
          marker = '/* M11: intent-first acquisition and truthful static-flow semantics. */'
          if marker not in css_text:
              css.write_text(css_text + '''\n\n/* M11: intent-first acquisition and truthful static-flow semantics. */\n.acquisition-intent {\n  width: min(100% - 32px, 760px);\n  margin: clamp(28px, 9vh, 88px) auto 0;\n  border-block: 1px solid var(--color-cs-border);\n  background: var(--color-cs-panel);\n}\n\n.acquisition-intent-copy {\n  padding: 12px 14px 10px;\n  border-bottom: 1px solid var(--color-cs-border);\n}\n\n.acquisition-intent-copy h2,\n.acquisition-intent-copy p {\n  margin: 0;\n}\n\n.acquisition-intent-copy h2 {\n  margin-top: 2px;\n  font-size: 13px;\n}\n\n.acquisition-intent-copy > p:last-child {\n  margin-top: 4px;\n  color: var(--color-cs-muted);\n  font-size: 11px;\n}\n\n.acquisition-intent-actions {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n}\n\n.acquisition-intent-action {\n  display: flex;\n  min-width: 0;\n  flex-direction: column;\n  gap: 3px;\n  padding: 12px 14px;\n  border: 0;\n  border-right: 1px solid var(--color-cs-border);\n  background: transparent;\n  color: var(--color-cs-text);\n  text-align: left;\n  cursor: pointer;\n  transition: background-color 100ms ease;\n}\n\n.acquisition-intent-action:last-child {\n  border-right: 0;\n}\n\n.acquisition-intent-action:hover,\n.acquisition-intent-action:focus-visible {\n  background: var(--color-cs-hover);\n}\n\n.acquisition-intent-action:focus-visible {\n  outline: 1px solid var(--color-cs-focus);\n  outline-offset: -1px;\n}\n\n.acquisition-intent-action strong {\n  font-size: 11px;\n}\n\n.acquisition-intent-action span {\n  color: var(--color-cs-muted);\n  font-size: 10px;\n  line-height: 1.45;\n}\n\n.acquisition-task {\n  display: flex;\n  flex-direction: column;\n}\n\n.acquisition-task-bar {\n  display: flex;\n  width: min(100% - 32px, 960px);\n  min-height: 32px;\n  margin: 12px auto 0;\n  align-items: center;\n  justify-content: space-between;\n  border-bottom: 1px solid var(--color-cs-border);\n  color: var(--color-cs-muted);\n  font-size: 10px;\n}\n\n.flow-truth-note {\n  max-width: 720px;\n  margin: 3px 0 0;\n  color: var(--color-cs-muted);\n  font-size: 10px;\n  font-weight: 400;\n  line-height: 1.4;\n}\n\n@media (max-width: 640px) {\n  .acquisition-intent-actions {\n    grid-template-columns: 1fr;\n  }\n\n  .acquisition-intent-action {\n    border-right: 0;\n    border-bottom: 1px solid var(--color-cs-border);\n  }\n\n  .acquisition-intent-action:last-child {\n    border-bottom: 0;\n  }\n}\n''')
          PY
          pnpm exec prettier --write apps/web/src/App.tsx apps/web/src/App.test.tsx apps/web/src/product-workbench.css
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/App.tsx apps/web/src/App.test.tsx apps/web/src/product-workbench.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: clarify entry intent and static call semantics"
          git push
