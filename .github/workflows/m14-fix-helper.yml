name: Fix M14 Helper

on:
  push:
    branches:
      - refactor/professional-graph-navigation

jobs:
  fix:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/professional-graph-navigation
      - name: Preserve literal replacement strings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/m14-apply.yml')
          text = path.read_text()
          replacements = {
              "              graph_canvas,\n              text,\n              count=1,": "              lambda _: graph_canvas,\n              text,\n              count=1,",
              "              layout_graph,\n              text,\n              count=1,": "              lambda _: layout_graph,\n              text,\n              count=1,",
              "              source_snippet,\n              text,\n              count=1,": "              lambda _: source_snippet,\n              text,\n              count=1,",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing helper anchor: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/m14-apply.yml
          git rm .github/workflows/m14-fix-helper.yml
          git commit -m "chore: preserve M14 patch literals"
          git push origin HEAD:refactor/professional-graph-navigation
