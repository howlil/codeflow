name: Format M12 CSS

on:
  push:
    branches:
      - refactor/m12-graph-first-codeflow

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format graph workspace CSS and remove helper
        shell: bash
        run: |
          pnpm exec prettier --write apps/web/src/graph-workspace.css
          rm .github/workflows/m12-css-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format graph workspace"
          git push
