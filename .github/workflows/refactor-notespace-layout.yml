name: Refactor Notespace-style frontend layout

on:
  push:
    branches:
      - refactor/notespace-layout

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/notespace-layout
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reorganize frontend by responsibility
        shell: bash
        run: |
          set -euo pipefail

          if [ -f apps/web/src/features/workspace/GraphWorkspace.tsx ]; then
            echo "Frontend is already reorganized."
            exit 0
          fi

          mkdir -p \
            apps/web/src/components/ui \
            apps/web/src/domain/graph \
            apps/web/src/features/acquisition \
            apps/web/src/features/workspace \
            apps/web/src/integrations/api \
            apps/web/src/styles

          git mv apps/web/src/ui/cn.ts apps/web/src/components/ui/cn.ts
          git mv apps/web/src/ui/primitives.tsx apps/web/src/components/ui/primitives.tsx

          git mv apps/web/src/graph-model.ts apps/web/src/domain/graph/graph-model.ts
          git mv apps/web/src/graph-model.test.ts apps/web/src/domain/graph/graph-model.test.ts

          git mv apps/web/src/GitHubPullRequestPicker.tsx apps/web/src/features/acquisition/GitHubPullRequestPicker.tsx
          git mv apps/web/src/GitHubRepositoryPicker.tsx apps/web/src/features/acquisition/GitHubRepositoryPicker.tsx
          git mv apps/web/src/GitHubRepositoryPicker.test.tsx apps/web/src/features/acquisition/GitHubRepositoryPicker.test.tsx
          git mv apps/web/src/RepositoryPicker.tsx apps/web/src/features/acquisition/RepositoryPicker.tsx

          git mv apps/web/src/GraphWorkspace.tsx apps/web/src/features/workspace/GraphWorkspace.tsx
          git mv apps/web/src/StaticFlowPanel.tsx apps/web/src/features/workspace/StaticFlowPanel.tsx
          git mv apps/web/src/StaticFlowPanel.test.tsx apps/web/src/features/workspace/StaticFlowPanel.test.tsx

          git mv apps/web/src/flow-client.ts apps/web/src/integrations/api/flow-client.ts
          git mv apps/web/src/change-client.ts apps/web/src/integrations/api/change-client.ts

          for file in \
            anthropic-theme.css \
            architecture.css \
            change-workspace.css \
            graph-workspace.css \
            impact.css \
            index.css \
            package-topology.css \
            workbench.css; do
            git mv "apps/web/src/$file" "apps/web/src/styles/$file"
          done

          python <<'PY'
          from pathlib import Path

          replacements = {
              Path('apps/web/src/App.tsx'): {
                  "'./flow-client'": "'./integrations/api/flow-client'",
                  "'./change-client'": "'./integrations/api/change-client'",
                  "'./GitHubPullRequestPicker'": "'./features/acquisition/GitHubPullRequestPicker'",
                  "'./GitHubRepositoryPicker'": "'./features/acquisition/GitHubRepositoryPicker'",
                  "'./GraphWorkspace'": "'./features/workspace/GraphWorkspace'",
                  "'./RepositoryPicker'": "'./features/acquisition/RepositoryPicker'",
                  "'./graph-model'": "'./domain/graph/graph-model'",
                  "'./ui/primitives'": "'./components/ui/primitives'",
              },
              Path('apps/web/src/App.test.tsx'): {
                  "'./change-client'": "'./integrations/api/change-client'",
                  "'./flow-client'": "'./integrations/api/flow-client'",
              },
              Path('apps/web/src/features/acquisition/RepositoryPicker.tsx'): {
                  "'./flow-client'": "'../../integrations/api/flow-client'",
                  "'./ui/primitives'": "'../../components/ui/primitives'",
              },
              Path('apps/web/src/features/workspace/GraphWorkspace.tsx'): {
                  "'./change-client'": "'../../integrations/api/change-client'",
                  "'./flow-client'": "'../../integrations/api/flow-client'",
                  "'./graph-model'": "'../../domain/graph/graph-model'",
                  "'./RepositoryPicker'": "'../acquisition/RepositoryPicker'",
                  "'./ui/primitives'": "'../../components/ui/primitives'",
              },
              Path('apps/web/src/features/workspace/StaticFlowPanel.tsx'): {
                  "'./flow-client'": "'../../integrations/api/flow-client'",
                  "'./ui/primitives'": "'../../components/ui/primitives'",
              },
              Path('apps/web/src/features/workspace/StaticFlowPanel.test.tsx'): {
                  "'./flow-client'": "'../../integrations/api/flow-client'",
              },
              Path('apps/web/src/domain/graph/graph-model.ts'): {
                  "'./change-client'": "'../../integrations/api/change-client'",
                  "'./flow-client'": "'../../integrations/api/flow-client'",
              },
              Path('apps/web/src/domain/graph/graph-model.test.ts'): {
                  "'./change-client'": "'../../integrations/api/change-client'",
                  "'./flow-client'": "'../../integrations/api/flow-client'",
              },
              Path('apps/web/src/main.tsx'): {
                  "'./index.css'": "'./styles/index.css'",
                  "'./workbench.css'": "'./styles/workbench.css'",
                  "'./graph-workspace.css'": "'./styles/graph-workspace.css'",
                  "'./anthropic-theme.css'": "'./styles/anthropic-theme.css'",
              },
          }

          for path, changes in replacements.items():
              text = path.read_text()
              for old, new in changes.items():
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          rmdir apps/web/src/ui

          # Catch stale root-relative module imports introduced by the move.
          if grep -R -nE "from ['\"]\./(flow-client|change-client|graph-model|RepositoryPicker|ui/primitives)['\"]" \
            apps/web/src/features apps/web/src/domain; then
            echo "Stale imports remain after reorganization."
            exit 1
          fi

      - name: Format
        run: pnpm format

      - name: Verify
        run: pnpm check

      - name: Commit refactor and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refactor-notespace-layout.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: organize web source like Notespace"
          git push origin HEAD:refactor/notespace-layout
