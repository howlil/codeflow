name: Fix M13 dependents copy

on:
  push:
    branches:
      - refactor/evidence-first-graph-ui

jobs:
  fix:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/evidence-first-graph-ui
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Restore compact dependents status and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/GraphWorkspace.tsx')
          text = path.read_text()
          old = """                  {impact.summary.directCount} direct ·{' '}\n                  {impact.summary.transitiveCount} transitive dependents"""
          new = """                  Dependents: {impact.summary.directCount} direct ·{' '}\n                  {impact.summary.transitiveCount} transitive"""
          if old not in text:
              raise SystemExit('dependents status pattern not found')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write apps/web/src/GraphWorkspace.tsx
          pnpm exec prettier --check apps/web/src/GraphWorkspace.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/GraphWorkspace.tsx
          git rm .github/workflows/m13-copy-fix.yml
          git commit -m "fix: restore compact dependents status"
          git push origin HEAD:refactor/evidence-first-graph-ui
