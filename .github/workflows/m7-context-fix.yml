name: M7 Topology Context Fix

on:
  push:
    branches:
      - feat/m7-workspace-package-topology

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-workspace-package-topology
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Open topology at active package context
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path('apps/web/src/PackageTopologyPanel.tsx')
          text = panel.read_text()
          old = '''  const selectedPackage =\n    packages.find((entity) => entity.id === selectedPackageId) ?? packages[0]!;\n'''
          new = '''  const activeEntryEntity = flow.architecture?.entities.find(\n    (entity) => entity.id === flow.entryPointId,\n  );\n  const contextualPackageId =\n    activeEntryEntity === undefined\n      ? undefined\n      : topology.fileOwners[activeEntryEntity.path];\n  const selectedPackage =\n    packages.find((entity) => entity.id === selectedPackageId) ??\n    packages.find((entity) => entity.id === contextualPackageId) ??\n    packages[0]!;\n'''
          if old not in text:
              raise SystemExit('selected package target not found')
          text = text.replace(old, new, 1)
          old = '''              type="button"\n              aria-pressed={entity.id === selectedPackage.id}\n'''
          new = '''              type="button"\n              aria-label={`${entity.name} package ${entity.path}`}\n              aria-pressed={entity.id === selectedPackage.id}\n'''
          if old not in text:
              raise SystemExit('package button target not found')
          panel.write_text(text.replace(old, new, 1))

          test = Path('apps/web/src/PackageTopologyPanel.test.tsx')
          text = test.read_text()
          old = """    expect(screen.getByText('@demo/core')).toBeTruthy();\n"""
          new = """    expect(\n      screen.getByRole('button', { name: '@demo/core package packages/core' }),\n    ).toBeTruthy();\n"""
          if old not in text:
              raise SystemExit('test assertion target not found')
          test.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/web/src/PackageTopologyPanel.tsx apps/web/src/PackageTopologyPanel.test.tsx
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/PackageTopologyPanel.tsx apps/web/src/PackageTopologyPanel.test.tsx
          git commit -m 'fix(m7): orient topology to active package'
          git push origin HEAD:feat/m7-workspace-package-topology
