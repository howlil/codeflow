name: M7 GitHub Metadata Fix

on:
  push:
    branches:
      - feat/m7-workspace-package-topology

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-workspace-package-topology
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Distinguish repository and topology metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/github.ts')
          text = path.read_text()
          text = text.replace(
              "const metadata = await fetchJson<{ default_branch?: string; name?: string }>(",
              "const repositoryMetadata = await fetchJson<{ default_branch?: string; name?: string }>(",
              1,
          )
          text = text.replace('const branch = metadata.default_branch;', 'const branch = repositoryMetadata.default_branch;', 1)
          text = text.replace('name: metadata.name ?? parsed.repository,', 'name: repositoryMetadata.name ?? parsed.repository,', 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/api/src/github.ts
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/github.ts
          git commit -m 'fix(m7): distinguish GitHub repository metadata'
          git push origin HEAD:feat/m7-workspace-package-topology
