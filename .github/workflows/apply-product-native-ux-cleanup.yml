name: Apply product-native UX cleanup

'on':
  push:
    branches:
      - refactor/product-native-ux-cleanup
    paths:
      - .github/workflows/apply-product-native-ux-cleanup.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/product-native-ux-cleanup
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply milestone slices
        run: python .github/scripts/apply-product-native-ux-cleanup.py

      - name: Format
        run: pnpm format

      - name: Verify
        run: pnpm check

      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/apply-product-native-ux-cleanup.yml
          rm .github/scripts/apply-product-native-ux-cleanup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: make CodeFlow UX product-native'
          git push origin HEAD:refactor/product-native-ux-cleanup

# executor v2
