name: M7 Build Fix

on:
  push:
    branches:
      - feat/m7-workspace-package-topology

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-workspace-package-topology
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Preserve exact optional topology contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/analysis-core/src/repository-architecture.ts')
          text = path.read_text()
          old = '''  const flow = analyzeBaseTypeScriptRepository(input);\n  return {\n    ...flow,\n    architecture: buildRepositoryArchitecture(input.files),\n    topology: buildPackageTopology(input.files, input.metadata),\n  };\n'''
          new = '''  const flow = analyzeBaseTypeScriptRepository(input);\n  const topology = buildPackageTopology(input.files, input.metadata);\n  return {\n    ...flow,\n    architecture: buildRepositoryArchitecture(input.files),\n    ...(topology === undefined ? {} : { topology }),\n  };\n'''
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('target wrapper not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/analysis-core/src/repository-architecture.ts
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/analysis-core/src/repository-architecture.ts
          git commit -m 'fix(m7): omit absent topology projection'
          git push origin HEAD:feat/m7-workspace-package-topology
