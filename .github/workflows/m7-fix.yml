name: M7 Integration Fix

on:
  push:
    branches:
      - feat/m7-workspace-package-topology

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-workspace-package-topology
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Fix parser and local workspace anchoring
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('apps/api/src/app.ts')
          text = app.read_text()
          block = """  const metadataValue = body.metadata;\n  if (metadataValue !== undefined && !Array.isArray(metadataValue)) {\n    throw new InputError(\n      400,\n      'Repository metadata must be an array when provided.',\n    );\n  }\n  const metadata = (metadataValue ?? []).map((item, index) => {\n    if (\n      !isRecord(item) ||\n      typeof item.filePath !== 'string' ||\n      typeof item.text !== 'string'\n    ) {\n      throw new InputError(\n        400,\n        `Repository metadata at index ${index} must contain filePath and text strings.`,\n      );\n    }\n    return { filePath: item.filePath, text: item.text };\n  });\n\n"""
          github_start = text.index('function parseGitHubAnalysisPayload')
          local_start = text.index('function parseAnalyzeRepositoryPayload')
          github_section = text[github_start:local_start]
          if block in github_section:
              text = text[:github_start] + github_section.replace(block, '', 1) + text[local_start:]
          local_start = text.index('function parseAnalyzeRepositoryPayload')
          prepare_start = text.index('function prepareRepositoryInput')
          local_section = text[local_start:prepare_start]
          if block not in local_section:
              marker = """  if (\n    !isRecord(body.entryPoint) ||\n"""
              if marker not in local_section:
                  raise SystemExit('local entry marker missing')
              local_section = local_section.replace(marker, block + marker, 1)
              text = text[:local_start] + local_section + text[prepare_start:]
          app.write_text(text)

          topology = Path('packages/analysis-core/src/package-topology.ts')
          text = topology.read_text()
          old = """  for (const manifest of manifests) {\n    if (manifest.rootPath === '.') {\n      manifest.workspacePatterns.forEach((pattern) =>\n        patterns.add(normalizePattern(pattern)),\n      );\n    }\n  }\n"""
          new = """  for (const manifest of manifests) {\n    manifest.workspacePatterns.forEach((pattern) =>\n      patterns.add(\n        normalizePath(`${manifest.rootPath}/${normalizePattern(pattern)}`),\n      ),\n    );\n  }\n"""
          if old in text:
              text = text.replace(old, new, 1)
          old = """      for (const pattern of parsePnpmWorkspacePatterns(item.text)) {\n        patterns.add(normalizePattern(pattern));\n      }\n"""
          new = """      for (const pattern of parsePnpmWorkspacePatterns(item.text)) {\n        patterns.add(\n          normalizePath(`${dirname(item.filePath)}/${normalizePattern(pattern)}`),\n        );\n      }\n"""
          if old in text:
              text = text.replace(old, new, 1)
          old = """      metadata.find(\n        (item) =>\n          basename(item.filePath) === 'package.json' &&\n          dirname(item.filePath) === '.',\n      );\n"""
          new = """      metadata.find(\n        (item) =>\n          basename(item.filePath) === 'package.json' &&\n          item.text.includes('workspaces'),\n      );\n"""
          if old in text:
              text = text.replace(old, new, 1)
          topology.write_text(text)
          PY
          pnpm exec prettier --write apps/api/src/app.ts packages/analysis-core/src/package-topology.ts
          if git diff --quiet; then
            echo 'Fix already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/app.ts packages/analysis-core/src/package-topology.ts
          git commit -m 'fix(m7): place metadata parsing at local analysis boundary'
          git push origin HEAD:feat/m7-workspace-package-topology
