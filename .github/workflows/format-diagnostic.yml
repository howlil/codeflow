name: Format Diagnostic

on:
  push:
    branches:
      - refactor/comprehension-first-workbench

permissions:
  contents: write

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier output
        shell: bash
        run: |
          pnpm exec prettier --write apps/web/src/App.tsx
          if git diff --quiet -- apps/web/src/App.tsx; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/App.tsx
          git commit -m "style: apply prettier output"
          git push
