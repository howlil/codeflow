name: Format diagnostic

on:
  push:
    branches:
      - design/chatspace-system

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format reported files
        run: >-
          pnpm exec prettier --write
          apps/web/src/App.test.tsx
          apps/web/src/App.tsx
          apps/web/src/index.css
          apps/web/src/StaticFlowPanel.tsx
          apps/web/src/ui/primitives.tsx

      - name: Commit formatted source and remove diagnostic workflow
        shell: bash
        run: |
          rm .github/workflows/format-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.test.tsx apps/web/src/App.tsx apps/web/src/index.css apps/web/src/StaticFlowPanel.tsx apps/web/src/ui/primitives.tsx .github/workflows/format-diagnostic.yml
          git commit -m "style: apply repository formatting"
          git push origin HEAD:design/chatspace-system
