name: M6 Format Debug

on:
  push:
    branches:
      - feat/m6-repository-architecture-symbol-navigation

permissions:
  contents: write

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m6-repository-architecture-symbol-navigation
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier formatting
        run: |
          pnpm exec prettier --write \
            apps/web/src/ArchitecturePanel.test.tsx \
            apps/web/src/ArchitecturePanel.tsx \
            packages/analysis-core/src/repository-architecture.ts
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/ArchitecturePanel.test.tsx \
            apps/web/src/ArchitecturePanel.tsx \
            packages/analysis-core/src/repository-architecture.ts
          git commit -m "style(m6): apply repository formatter"
          git push origin HEAD:feat/m6-repository-architecture-symbol-navigation
