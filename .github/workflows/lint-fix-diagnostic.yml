name: Lint fix diagnostic

on:
  push:
    branches:
      - design/chatspace-system

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply targeted lint fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/App.tsx')
          text = path.read_text()
          effect = "\n  useEffect(() => {\n    setActiveSearchIndex(0);\n  }, [query]);\n"
          replacement_from = "                    onChange={(event) => setQuery(event.target.value)}"
          replacement_to = """                    onChange={(event) => {
                      setQuery(event.target.value);
                      setActiveSearchIndex(0);
                    }}"""
          if effect not in text:
              raise SystemExit('query reset effect not found')
          if replacement_from not in text:
              raise SystemExit('search onChange not found')
          text = text.replace(effect, '\n', 1)
          text = text.replace(replacement_from, replacement_to, 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/App.tsx

      - name: Commit fix and remove diagnostic workflow
        shell: bash
        run: |
          rm .github/workflows/lint-fix-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx .github/workflows/lint-fix-diagnostic.yml
          git commit -m "fix: reset search selection at input boundary"
          git push origin HEAD:design/chatspace-system
