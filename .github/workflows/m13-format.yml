name: Format M13 UI

on:
  push:
    branches:
      - refactor/evidence-first-graph-ui

jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/evidence-first-graph-ui
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format M13 UI and remove helper
        run: |
          pnpm exec prettier --write apps/web/src/GraphWorkspace.tsx apps/web/src/graph-workspace.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/GraphWorkspace.tsx apps/web/src/graph-workspace.css
          git rm .github/workflows/m13-format.yml
          git commit -m "style: format evidence-first graph UI"
          git push origin HEAD:refactor/evidence-first-graph-ui
