name: Run M14 Patch

on:
  push:
    branches:
      - refactor/professional-graph-navigation

jobs:
  apply:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/professional-graph-navigation
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: python scripts/m14_patch.py
      - run: pnpm exec prettier --write apps/web/src/GraphWorkspace.tsx apps/web/src/graph-workspace.css apps/web/src/App.test.tsx .agents/DESIGN.md
      - run: pnpm exec prettier --check apps/web/src/GraphWorkspace.tsx apps/web/src/graph-workspace.css apps/web/src/App.test.tsx .agents/DESIGN.md
      - run: pnpm --filter @codeflow/web typecheck
      - name: Commit M14 runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/GraphWorkspace.tsx apps/web/src/graph-workspace.css apps/web/src/App.test.tsx .agents/DESIGN.md
          git rm .github/workflows/m14-apply-v2.yml .github/workflows/m14-run.yml scripts/m14_patch.py
          git commit -m "refactor: professionalize graph navigation"
          git push origin HEAD:refactor/professional-graph-navigation
