name: M10 Wire

on:
  push:
    branches:
      - feat/m10-static-behavior-delta
    paths:
      - .github/workflows/m10-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m10-static-behavior-delta
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node .github/m10-wire.mjs
      - run: pnpm exec prettier --write .github/m10-wire.mjs packages/analysis-core/src/behavior-delta.ts packages/analysis-core/src/behavior-delta.test.ts packages/analysis-core/src/change-analysis.ts packages/analysis-core/src/index.ts apps/web/src/change-client.ts apps/web/src/ChangeWorkspace.tsx apps/web/src/ChangeWorkspace.test.tsx apps/web/src/change-workspace.css
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore .github/m10-wire.mjs
          git add packages/analysis-core/src/behavior-delta.ts packages/analysis-core/src/behavior-delta.test.ts packages/analysis-core/src/change-analysis.ts packages/analysis-core/src/index.ts apps/web/src/change-client.ts apps/web/src/ChangeWorkspace.tsx apps/web/src/ChangeWorkspace.test.tsx apps/web/src/change-workspace.css
          git commit -m "feat(m10): integrate static behavior deltas"
          git push origin HEAD:feat/m10-static-behavior-delta
