name: Apply M14 Graph Navigation

on:
  push:
    branches:
      - refactor/professional-graph-navigation

jobs:
  apply:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/professional-graph-navigation
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply graph interaction refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/src/GraphWorkspace.tsx')
          text = path.read_text()

          old = """import { Button, Input, Select } from './ui/primitives';"""
          new = """import { Button, IconButton, Input, Select } from './ui/primitives';"""
          if old not in text:
              raise SystemExit('primitive import anchor missing')
          text = text.replace(old, new, 1)

          old = """const NODE_WIDTH = 196;
          const NODE_HEIGHT = 72;
          const COLUMN_GAP = 72;
          const ROW_GAP = 34;"""
          new = """const NODE_WIDTH = 196;
          const NODE_HEIGHT = 72;
          const COLUMN_GAP = 72;
          const ROW_GAP = 34;
          const MIN_GRAPH_ZOOM = 0.6;
          const MAX_GRAPH_ZOOM = 1.4;
          const GRAPH_ZOOM_STEP = 0.1;

          type SourceSnippetLine = {
            lineNumber: number;
            text: string;
            active: boolean;
          };"""
          if old not in text:
              raise SystemExit('graph constants anchor missing')
          text = text.replace(old, new, 1)

          graph_canvas = r'''function GraphCanvas({
            nodes,
            edges,
            layout,
            focusId,
            selectedNodeId,
            selectedEdgeId,
            impactIds,
            onSelectNode,
            onSelectEdge,
          }: {
            nodes: SemanticGraphNode[];
            edges: SemanticGraphEdge[];
            layout: GraphLayout;
            focusId: string | null;
            selectedNodeId: string | null;
            selectedEdgeId: string | null;
            impactIds: Set<string>;
            onSelectNode: (id: string) => void;
            onSelectEdge: (id: string) => void;
          }) {
            const canvasRef = useRef<HTMLDivElement>(null);
            const [zoom, setZoom] = useState(1);

            const nodesById = useMemo(
              () => new Map(nodes.map((node) => [node.id, node])),
              [nodes],
            );

            const emphasis = useMemo(() => {
              const nodeIds = new Set<string>();
              const edgeIds = new Set<string>();
              const activeNodeId = selectedNodeId ?? focusId;

              if (selectedEdgeId !== null) {
                const selectedEdge = edges.find((edge) => edge.id === selectedEdgeId);
                if (selectedEdge !== undefined) {
                  edgeIds.add(selectedEdge.id);
                  nodeIds.add(selectedEdge.sourceId);
                  nodeIds.add(selectedEdge.targetId);
                }
              } else if (activeNodeId !== null) {
                nodeIds.add(activeNodeId);
                for (const edge of edges) {
                  if (edge.sourceId === activeNodeId || edge.targetId === activeNodeId) {
                    edgeIds.add(edge.id);
                    nodeIds.add(edge.sourceId);
                    nodeIds.add(edge.targetId);
                  }
                }
              }

              for (const id of impactIds) {
                nodeIds.add(id);
              }
              for (const edge of edges) {
                if (impactIds.has(edge.sourceId) && impactIds.has(edge.targetId)) {
                  edgeIds.add(edge.id);
                }
              }

              return {
                nodeIds,
                edgeIds,
                active: selectedEdgeId !== null || activeNodeId !== null,
              };
            }, [edges, focusId, impactIds, selectedEdgeId, selectedNodeId]);

            function clampZoom(value: number) {
              return Math.min(MAX_GRAPH_ZOOM, Math.max(MIN_GRAPH_ZOOM, value));
            }

            function zoomBy(delta: number) {
              setZoom((current) => clampZoom(Number((current + delta).toFixed(2))));
            }

            function centerFocus(behavior: ScrollBehavior = 'smooth') {
              const canvas = canvasRef.current;
              if (canvas === null || focusId === null) {
                return;
              }
              const position = layout.positions.get(focusId);
              if (
                position === undefined ||
                canvas.clientWidth <= 0 ||
                canvas.clientHeight <= 0 ||
                typeof canvas.scrollTo !== 'function'
              ) {
                return;
              }
              const focusX = (position.x + NODE_WIDTH / 2) * zoom;
              const focusY = (position.y + NODE_HEIGHT / 2) * zoom;
              canvas.scrollTo({
                left: Math.max(0, focusX - canvas.clientWidth / 2),
                top: Math.max(0, focusY - canvas.clientHeight / 2),
                behavior,
              });
            }

            function fitGraph() {
              const canvas = canvasRef.current;
              if (
                canvas === null ||
                canvas.clientWidth <= 0 ||
                canvas.clientHeight <= 0
              ) {
                return;
              }
              const horizontal = (canvas.clientWidth - 56) / layout.width;
              const vertical = (canvas.clientHeight - 56) / layout.height;
              const nextZoom = clampZoom(Math.min(1, horizontal, vertical));
              setZoom(nextZoom);
              if (typeof canvas.scrollTo === 'function') {
                requestAnimationFrame(() => {
                  canvas.scrollTo({
                    left: Math.max(
                      0,
                      (layout.width * nextZoom - canvas.clientWidth) / 2,
                    ),
                    top: Math.max(
                      0,
                      (layout.height * nextZoom - canvas.clientHeight) / 2,
                    ),
                    behavior: 'smooth',
                  });
                });
              }
            }

            useEffect(() => {
              centerFocus('auto');
            }, [focusId, layout, zoom]);

            if (nodes.length === 0) {
              return (
                <div className="graph-empty-state" role="status">
                  <strong>No semantic entities in this projection</strong>
                  <span>Change level or relationship lens to continue.</span>
                </div>
              );
            }

            const dense = edges.length >= 8;

            return (
              <div className="graph-canvas-shell">
                <div
                  ref={canvasRef}
                  className={`graph-canvas${dense ? ' graph-canvas--dense' : ''}`}
                  role="region"
                  aria-label="Semantic code graph"
                >
                  <div
                    className="graph-viewport"
                    style={{
                      width: layout.width * zoom,
                      height: layout.height * zoom,
                    }}
                  >
                    <div
                      className="graph-stage"
                      style={{
                        width: layout.width,
                        height: layout.height,
                        transform: `scale(${zoom})`,
                      }}
                    >
                      <svg
                        className="graph-edge-layer"
                        width={layout.width}
                        height={layout.height}
                        viewBox={`0 0 ${layout.width} ${layout.height}`}
                        aria-label="Semantic relationships"
                      >
                        <defs>
                          <marker
                            id="codeflow-arrow"
                            viewBox="0 0 10 10"
                            refX="8"
                            refY="5"
                            markerWidth="5"
                            markerHeight="5"
                            orient="auto-start-reverse"
                          >
                            <path d="M 0 0 L 10 5 L 0 10 z" />
                          </marker>
                        </defs>
                        {edges.map((edge) => {
                          const source = layout.positions.get(edge.sourceId);
                          const target = layout.positions.get(edge.targetId);
                          const sourceNode = nodesById.get(edge.sourceId);
                          const targetNode = nodesById.get(edge.targetId);
                          if (source === undefined || target === undefined) {
                            return null;
                          }
                          const path = edgePath(source, target);
                          const trust = evidenceTrust(edge.evidence);
                          const muted =
                            emphasis.active && !emphasis.edgeIds.has(edge.id);
                          const label = `${sourceNode?.label ?? edge.sourceId} ${edge.kind} ${targetNode?.label ?? edge.targetId}`;
                          return (
                            <g
                              key={edge.id}
                              className={`graph-edge graph-edge--${trust}${
                                edge.changeKind === undefined
                                  ? ''
                                  : ` graph-edge--change-${edge.changeKind}`
                              }${
                                selectedEdgeId === edge.id
                                  ? ' graph-edge--selected'
                                  : ''
                              }${muted ? ' graph-edge--muted' : ''}`}
                              role="button"
                              tabIndex={0}
                              aria-label={label}
                              aria-pressed={selectedEdgeId === edge.id}
                              onClick={() => onSelectEdge(edge.id)}
                              onKeyDown={(event) => {
                                if (event.key === 'Enter' || event.key === ' ') {
                                  event.preventDefault();
                                  onSelectEdge(edge.id);
                                }
                              }}
                            >
                              <path className="graph-edge-hit" d={path} />
                              <path
                                className="graph-edge-line"
                                d={path}
                                markerEnd="url(#codeflow-arrow)"
                              />
                              <text
                                className="graph-edge-label"
                                x={(source.x + target.x + NODE_WIDTH) / 2}
                                y={(source.y + target.y + NODE_HEIGHT) / 2 - 6}
                                textAnchor="middle"
                              >
                                {edge.kind}
                              </text>
                            </g>
                          );
                        })}
                      </svg>

                      {nodes.map((node) => {
                        const position = layout.positions.get(node.id);
                        if (position === undefined) {
                          return null;
                        }
                        const muted =
                          emphasis.active && !emphasis.nodeIds.has(node.id);
                        return (
                          <button
                            key={node.id}
                            type="button"
                            className={`semantic-graph-node${
                              focusId === node.id ? ' semantic-graph-node--focus' : ''
                            }${
                              selectedNodeId === node.id
                                ? ' semantic-graph-node--selected'
                                : ''
                            }${
                              node.entryPoint ? ' semantic-graph-node--entry' : ''
                            }${
                              impactIds.has(node.id)
                                ? ' semantic-graph-node--impact'
                                : ''
                            }${
                              node.changeKind === undefined
                                ? ''
                                : ` semantic-graph-node--change-${node.changeKind}`
                            }${muted ? ' semantic-graph-node--muted' : ''}`}
                            style={{ left: position.x, top: position.y }}
                            aria-pressed={selectedNodeId === node.id}
                            aria-label={`${node.kind} ${node.label}${
                              node.changeKind === undefined
                                ? ''
                                : ` ${node.changeKind}`
                            }`}
                            onClick={() => onSelectNode(node.id)}
                          >
                            <span className="semantic-graph-node-meta">
                              <span>{node.kind}</span>
                              {node.entryPoint ? <span>ENTRY</span> : null}
                              {node.changeKind !== undefined ? (
                                <span>{node.changeKind.toUpperCase()}</span>
                              ) : null}
                            </span>
                            <strong>{node.label}</strong>
                            <span className="semantic-graph-node-path">
                              {compactPath(node.path)}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <div
                  className="graph-viewport-controls"
                  role="group"
                  aria-label="Graph viewport controls"
                >
                  <IconButton
                    aria-label="Zoom out"
                    title="Zoom out"
                    disabled={zoom <= MIN_GRAPH_ZOOM}
                    onClick={() => zoomBy(-GRAPH_ZOOM_STEP)}
                  >
                    −
                  </IconButton>
                  <span aria-live="polite">{Math.round(zoom * 100)}%</span>
                  <IconButton
                    aria-label="Zoom in"
                    title="Zoom in"
                    disabled={zoom >= MAX_GRAPH_ZOOM}
                    onClick={() => zoomBy(GRAPH_ZOOM_STEP)}
                  >
                    +
                  </IconButton>
                  <Button variant="ghost" onClick={fitGraph}>
                    Fit graph
                  </Button>
                  <Button variant="ghost" onClick={() => centerFocus()}>
                    Center focus
                  </Button>
                </div>
              </div>
            );
          }

          function GraphInspector({'''

          text, count = re.subn(
              r"function GraphCanvas\(\{.*?\nfunction GraphInspector\(\{",
              graph_canvas,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'GraphCanvas replacement count={count}')

          old = """          <pre className=\"graph-source-snippet\">\n            <code>{snippet}</code>\n          </pre>"""
          new = """          <pre className=\"graph-source-snippet\">\n            <code>\n              {snippet.map((line) => (\n                <span\n                  key={line.lineNumber}\n                  className={`graph-source-line${\n                    line.active ? ' graph-source-line--active' : ''\n                  }`}\n                  aria-current={line.active ? 'location' : undefined}\n                >\n                  <span className=\"graph-source-line-number\">\n                    {line.lineNumber}\n                  </span>\n                  <span className=\"graph-source-line-code\">\n                    {line.text === '' ? ' ' : line.text}\n                  </span>\n                </span>\n              ))}\n            </code>\n          </pre>"""
          if old not in text:
              raise SystemExit('source snippet render anchor missing')
          text = text.replace(old, new, 1)

          layout_graph = r'''function layoutGraph(
            nodes: SemanticGraphNode[],
            edges: SemanticGraphEdge[],
            focusId: string | null,
          ): GraphLayout {
            if (nodes.length === 0) {
              return { positions: new Map(), width: 640, height: 360 };
            }
            const ids = new Set(nodes.map((node) => node.id));
            const rootId = focusId !== null && ids.has(focusId) ? focusId : nodes[0]?.id;
            const depth = new Map<string, number>();
            if (rootId !== undefined) {
              depth.set(rootId, 0);
            }

            for (let pass = 0; pass < nodes.length * 2; pass += 1) {
              let changed = false;
              for (const edge of edges) {
                const sourceDepth = depth.get(edge.sourceId);
                const targetDepth = depth.get(edge.targetId);
                if (sourceDepth !== undefined && targetDepth === undefined) {
                  depth.set(edge.targetId, sourceDepth + 1);
                  changed = true;
                } else if (targetDepth !== undefined && sourceDepth === undefined) {
                  depth.set(edge.sourceId, targetDepth - 1);
                  changed = true;
                }
              }
              if (!changed) {
                break;
              }
            }

            const unresolved = nodes.filter((node) => !depth.has(node.id));
            const maxDepth = Math.max(0, ...Array.from(depth.values()));
            for (const node of unresolved) {
              depth.set(node.id, maxDepth + 1);
            }

            const groups = new Map<number, SemanticGraphNode[]>();
            for (const node of nodes) {
              const nodeDepth = depth.get(node.id) ?? 0;
              const group = groups.get(nodeDepth) ?? [];
              group.push(node);
              groups.set(nodeDepth, group);
            }
            for (const group of groups.values()) {
              group.sort((left, right) => left.label.localeCompare(right.label));
            }

            const depths = Array.from(groups.keys()).sort((left, right) => left - right);
            const rootDepth = rootId === undefined ? 0 : (depth.get(rootId) ?? 0);

            for (let pass = 0; pass < 3; pass += 1) {
              const order = new Map<string, number>();
              for (const nodeDepth of depths) {
                const group = groups.get(nodeDepth) ?? [];
                group.forEach((node, index) => order.set(node.id, index));
              }

              const orderedDepths = [...depths].sort((left, right) => {
                const distance = Math.abs(left - rootDepth) - Math.abs(right - rootDepth);
                return distance === 0 ? left - right : distance;
              });

              for (const nodeDepth of orderedDepths) {
                if (nodeDepth === rootDepth) {
                  continue;
                }
                const anchorDepth =
                  nodeDepth < rootDepth ? nodeDepth + 1 : nodeDepth - 1;
                const anchorIds = new Set(
                  (groups.get(anchorDepth) ?? []).map((node) => node.id),
                );
                const group = groups.get(nodeDepth) ?? [];
                group.sort((left, right) => {
                  const leftScore = relationshipOrderScore(
                    left.id,
                    anchorIds,
                    edges,
                    order,
                  );
                  const rightScore = relationshipOrderScore(
                    right.id,
                    anchorIds,
                    edges,
                    order,
                  );
                  if (leftScore !== rightScore) {
                    return leftScore - rightScore;
                  }
                  return left.label.localeCompare(right.label);
                });
              }
            }

            const minDepth = depths[0] ?? 0;
            const tallest = Math.max(
              1,
              ...Array.from(groups.values(), (group) => group.length),
            );
            const graphContentHeight =
              tallest * NODE_HEIGHT + Math.max(0, tallest - 1) * ROW_GAP;
            const positions = new Map<string, GraphPosition>();

            for (const nodeDepth of depths) {
              const group = groups.get(nodeDepth) ?? [];
              const groupHeight =
                group.length * NODE_HEIGHT +
                Math.max(0, group.length - 1) * ROW_GAP;
              const yOffset = 42 + Math.max(0, (graphContentHeight - groupHeight) / 2);
              group.forEach((node, index) => {
                positions.set(node.id, {
                  x: 42 + (nodeDepth - minDepth) * (NODE_WIDTH + COLUMN_GAP),
                  y: yOffset + index * (NODE_HEIGHT + ROW_GAP),
                });
              });
            }

            return {
              positions,
              width: Math.max(
                680,
                84 +
                  depths.length * NODE_WIDTH +
                  Math.max(0, depths.length - 1) * COLUMN_GAP,
              ),
              height: Math.max(420, 84 + graphContentHeight),
            };
          }

          function relationshipOrderScore(
            nodeId: string,
            anchorIds: Set<string>,
            edges: SemanticGraphEdge[],
            order: Map<string, number>,
          ): number {
            const scores: number[] = [];
            for (const edge of edges) {
              if (edge.sourceId === nodeId && anchorIds.has(edge.targetId)) {
                const value = order.get(edge.targetId);
                if (value !== undefined) scores.push(value);
              } else if (edge.targetId === nodeId && anchorIds.has(edge.sourceId)) {
                const value = order.get(edge.sourceId);
                if (value !== undefined) scores.push(value);
              }
            }
            if (scores.length === 0) {
              return Number.POSITIVE_INFINITY;
            }
            return scores.reduce((sum, value) => sum + value, 0) / scores.length;
          }

          function edgePath('''

          text, count = re.subn(
              r"function layoutGraph\(.*?\nfunction edgePath\(",
              layout_graph,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'layoutGraph replacement count={count}')

          source_snippet = r'''function sourceSnippet(
            flow: FlowProjection,
            location: SourceLocation | null,
          ): SourceSnippetLine[] | null {
            if (location === null) {
              return null;
            }
            const source = flow.sources.find(
              (candidate) => candidate.filePath === location.filePath,
            );
            if (source === undefined) {
              return null;
            }
            const lines = source.text.split('\n');
            const start = Math.max(0, location.startLine - 3);
            const end = Math.min(
              lines.length,
              Math.max(location.endLine + 2, location.startLine + 4),
              start + 14,
            );
            return lines.slice(start, end).map((line, index) => {
              const lineNumber = start + index + 1;
              return {
                lineNumber,
                text: line,
                active:
                  lineNumber >= location.startLine && lineNumber <= location.endLine,
              };
            });
          }

          function evidenceTrust('''

          text, count = re.subn(
              r"function sourceSnippet\(.*?\nfunction evidenceTrust\(",
              source_snippet,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'sourceSnippet replacement count={count}')

          path.write_text(text)

          css_path = Path('apps/web/src/graph-workspace.css')
          css = css_path.read_text()
          css += r'''

          /* M14: professional graph navigation and attention model. */
          .graph-workspace-body {
            grid-template-columns: minmax(0, 1fr) minmax(320px, 352px);
          }

          .graph-level-switcher small {
            font-size: 10px;
          }

          .graph-canvas-shell {
            position: relative;
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: var(--color-cs-bg);
          }

          .graph-canvas {
            position: absolute;
            inset: 0;
            display: block;
            overflow: auto;
          }

          .graph-viewport {
            position: relative;
            min-width: 100%;
            min-height: 100%;
          }

          .graph-stage {
            transform-origin: 0 0;
          }

          .graph-viewport-controls {
            position: absolute;
            z-index: 12;
            left: 10px;
            bottom: 10px;
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 2px;
            border: 1px solid var(--color-cs-border);
            border-radius: 4px;
            background: var(--color-cs-panel);
          }

          .graph-viewport-controls > span {
            min-width: 38px;
            color: var(--color-cs-muted);
            font-family: var(--font-mono);
            font-size: 10px;
            text-align: center;
          }

          .graph-viewport-controls button {
            min-width: 28px;
          }

          .semantic-graph-node,
          .graph-edge {
            transition:
              opacity 100ms ease,
              background 90ms ease,
              border-color 90ms ease;
          }

          .semantic-graph-node--selected {
            background: var(--color-cs-active);
          }

          .semantic-graph-node--muted {
            opacity: 0.28;
          }

          .graph-edge--muted {
            opacity: 0.18;
          }

          .graph-edge--selected .graph-edge-line {
            stroke-width: 1.8;
          }

          .graph-canvas--dense .graph-edge-label {
            opacity: 0;
            transition: opacity 90ms ease;
          }

          .graph-canvas--dense .graph-edge:hover .graph-edge-label,
          .graph-canvas--dense .graph-edge:focus-visible .graph-edge-label,
          .graph-canvas--dense .graph-edge--selected .graph-edge-label {
            opacity: 1;
          }

          .graph-source-snippet code {
            display: grid;
          }

          .graph-source-line {
            display: grid;
            grid-template-columns: 34px minmax(max-content, 1fr);
            min-height: 18px;
            border-left: 2px solid transparent;
          }

          .graph-source-line--active {
            background: var(--color-cs-active);
            border-left-color: var(--color-cs-focus);
          }

          .graph-source-line-number {
            padding-right: 8px;
            color: var(--color-cs-subtle);
            text-align: right;
            user-select: none;
          }

          .graph-source-line-code {
            padding-right: 8px;
            white-space: pre;
          }

          @media (max-width: 1020px) {
            .graph-workspace-body {
              grid-template-columns: minmax(0, 1fr);
              grid-template-rows: minmax(320px, 1fr) minmax(280px, 40vh);
            }

            .graph-inspector {
              border-top: 1px solid var(--color-cs-border);
              border-left: 0;
            }
          }

          @media (max-width: 680px) {
            .graph-viewport-controls {
              right: 8px;
              bottom: 8px;
              left: 8px;
              justify-content: center;
              flex-wrap: wrap;
            }
          }

          @media (prefers-reduced-motion: reduce) {
            .semantic-graph-node,
            .graph-edge,
            .graph-canvas--dense .graph-edge-label {
              transition: none;
            }
          }
          '''
          css_path.write_text(css)

          test_path = Path('apps/web/src/App.test.tsx')
          tests = test_path.read_text()
          anchor = """    expect(\n      screen.getByRole('button', { name: /Function createOrder/ }),\n    ).toBeInTheDocument();"""
          insertion = """    expect(\n      screen.getByRole('button', { name: 'Zoom out' }),\n    ).toBeInTheDocument();\n    expect(\n      screen.getByRole('button', { name: 'Zoom in' }),\n    ).toBeInTheDocument();\n    expect(\n      screen.getByRole('button', { name: 'Fit graph' }),\n    ).toBeInTheDocument();\n    expect(\n      screen.getByRole('button', { name: 'Center focus' }),\n    ).toBeInTheDocument();\n    fireEvent.click(screen.getByRole('button', { name: 'Zoom in' }));\n    expect(screen.getByText('110%')).toBeInTheDocument();\n\n""" + anchor
          if anchor not in tests:
              raise SystemExit('test insertion anchor missing')
          tests = tests.replace(anchor, insertion, 1)
          test_path.write_text(tests)

          design_path = Path('.agents/DESIGN.md')
          design = design_path.read_text()
          marker = '## Context Bar\n'
          addition = '''## Graph Viewport & Attention\n\nThe graph is a navigable spatial surface, not a static poster. Provide compact controls for zooming, fitting the visible projection, and recentering the current focus. These controls are operational overlays and should stay visually quiet.\n\nSelection creates an attention neighborhood:\n\n- selected node or relationship remains strongest;\n- directly connected nodes/edges retain normal prominence;\n- unrelated visible graph content recedes but is not removed;\n- impact paths remain legible when impact mode is active.\n\nFor dense projections, edge labels are progressively disclosed on hover/focus/selection instead of showing every relationship label at equal prominence. Accessible relationship names remain available regardless of visual label visibility.\n\nLayered layout must remain deterministic. Prefer relationship-aware ordering within layers to reduce crossings, center smaller layers vertically around the active graph body, and group unresolved/disconnected entities rather than creating unnecessary horizontal columns.\n\nSource peek should visually mark the source range represented by the selected entity while preserving surrounding context lines.\n\n'''
          if marker not in design:
              raise SystemExit('DESIGN context marker missing')
          design = design.replace(marker, addition + marker, 1)
          design_path.write_text(design)
