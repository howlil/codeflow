name: Format M12

on:
  push:
    branches:
      - refactor/m12-graph-first-codeflow

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format M12 files and remove helper
        shell: bash
        run: |
          pnpm exec prettier --write \
            .agents/PROJECT.md \
            .agents/DESIGN.md \
            .agents/CURRENT_ITERATION.md \
            apps/web/src/App.tsx \
            apps/web/src/GraphWorkspace.tsx \
            apps/web/src/graph-model.ts \
            apps/web/src/graph-model.test.ts \
            apps/web/src/graph-workspace.css \
            apps/web/src/GitHubRepositoryPicker.tsx \
            apps/web/src/main.tsx
          rm .github/workflows/m12-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: format M12 graph-first refactor"
          git push
