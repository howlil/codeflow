name: Integrate product-native UX cleanup on current master

'on':
  push:
    branches:
      - refactor/product-native-ux-cleanup-latest
    paths:
      - .github/workflows/integrate-product-native-latest.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest master base
        uses: actions/checkout@v4
        with:
          ref: refactor/product-native-ux-cleanup-latest
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integrate verified milestone while preserving latest master deltas
        shell: bash
        run: |
          cp apps/web/src/App.test.tsx /tmp/master-App.test.tsx
          cp apps/web/src/styles/landing.css /tmp/master-landing.css
          git fetch origin refactor/product-native-ux-cleanup-final
          for path in \
            .agents/CURRENT_ITERATION.md \
            .agents/DESIGN.md \
            apps/web/src/App.test.tsx \
            apps/web/src/App.tsx \
            apps/web/src/components/ui/primitives.tsx \
            apps/web/src/features/acquisition/GitHubRepositoryPicker.test.tsx \
            apps/web/src/features/acquisition/GitHubRepositoryPicker.tsx \
            apps/web/src/features/acquisition/LandingExperience.tsx \
            apps/web/src/features/workspace/GraphWorkspace.tsx \
            apps/web/src/main.tsx \
            apps/web/src/styles/graph-workspace.css \
            apps/web/src/styles/index.css \
            apps/web/src/styles/landing.css
          do
            git show FETCH_HEAD:$path > $path
          done
          rm -f apps/web/src/styles/workbench.css apps/web/src/styles/anthropic-theme.css

          python <<'PY'
          from pathlib import Path

          # Preserve the latest-master loading-state visual simplification while
          # retaining the compact milestone-owned launcher above it.
          landing = Path('apps/web/src/styles/landing.css')
          milestone = landing.read_text()
          master = Path('/tmp/master-landing.css').read_text()
          marker = '.analysis-loading {'
          if marker not in milestone or marker not in master:
              raise SystemExit('analysis-loading marker missing')
          landing.write_text(milestone[:milestone.index(marker)] + master[master.index(marker):])

          # Preserve the newest master contract that the submitted repository URL
          # remains visible in the loading state. The milestone test already waits
          # correctly for AnimatePresence to finish the landing exit.
          test = Path('apps/web/src/App.test.tsx')
          text = test.read_text()
          needle = "    expect(\n      screen.getByRole('heading', {\n        name: 'Mapping the codebase into something you can follow.',\n      }),\n    ).toBeInTheDocument();\n"
          assertion = "    expect(screen.getByText('https://github.com/owner/demo')).toBeInTheDocument();\n"
          if assertion not in text:
              if needle not in text:
                  raise SystemExit('loading heading assertion block missing')
              text = text.replace(needle, needle + assertion)
          test.write_text(text)
          PY

      - name: Format
        run: pnpm format

      - name: Verify
        run: pnpm check

      - name: Commit final milestone
        shell: bash
        run: |
          rm .github/workflows/integrate-product-native-latest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: make CodeFlow UX product-native'
          git push origin HEAD:refactor/product-native-ux-cleanup-latest
