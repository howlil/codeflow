name: M8 Truthfulness Fix

on:
  push:
    branches:
      - feat/m8-change-impact-explorer

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-change-impact-explorer
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Preserve truthful partial empty state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/ImpactPanel.tsx')
          text = path.read_text()
          old = '''                  <span>
                    Supported static analysis did not find a matching downstream
                    relationship for this scope and filter.
                  </span>
'''
          new = '''                  <span>
                    Supported static analysis did not find a matching downstream
                    relationship for this scope and filter.
                  </span>
                  {impact.status === 'partial' ? (
                    <span>
                      Impact coverage is partial; absence from the result set is
                      not a safety guarantee.
                    </span>
                  ) : null}
'''
          if old not in text:
              raise SystemExit('target empty-state block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/web/src/ImpactPanel.tsx
          pnpm --filter @codeflow/web test -- ImpactPanel.test.tsx
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/ImpactPanel.tsx
          git commit -m "fix(m8): keep partial impact empty state truthful"
          git push origin HEAD:feat/m8-change-impact-explorer
